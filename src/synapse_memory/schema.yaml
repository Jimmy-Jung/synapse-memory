# Author: JunyoungJung
# Created: 2026-07-06
version: 1

common_fields:
  relation_evidence:
    type: list
    description: >-
      실제 typed relation별 근거. source는 claude-code:<relative .jsonl> 또는
      codex:<relative .jsonl> 식별자이며 절대 경로, 경로 순회, 빈 경로 구간, 역슬래시,
      제어문자를 허용하지 않는다. 추가 필드와 raw quote는 저장하지 않는다.
      byte 범위는 RawDoc 생성에 소비한 원본 JSONL 구간이고 char 범위는 그 전체 구간을
      source 추출기로 정규화한 RawDoc.text 안의 문자 범위다. 모든 offset은 bool이 아닌
      정수로 0 <= start < end이며 끝은 exclusive다. sha256은 char 범위 원문의 UTF-8
      해시(64자리 소문자 hex)다. target은 링크/alias 껍질을 벗기되 type:slug를 보존하며
      해당 페이지의 relation 대상과 정확히 일치해야 한다. 기존 sources는 페이지 전체 출처다.
    items:
      type: object
      additional_properties: false
      fields:
        relation:
          type: string
          required: true
        target:
          type: string
          required: true
        source:
          type: string
          required: true
        start_byte:
          type: integer
          required: true
        end_byte:
          type: integer
          required: true
        start_char:
          type: integer
          required: true
        end_char:
          type: integer
          required: true
        sha256:
          type: string
          required: true

types:
  project:
    folder: Entities/Projects
    statuses: [active, draft, completed, archived, superseded]
    fields:
      role:
        type: string
      period_start:
        type: string
      period_end:
        type: string
      domains:
        type: list
        items: string
      stack:
        type: list
        items: string
      keywords:
        type: list
        items: string
      metrics:
        type: list
        items:
          type: object
          fields:
            name:
              type: string
              required: true
            before:
              type: string
            after:
              type: string
            value:
              type: string
      confidence:
        type: number
      created:
        type: string
      t_invalid:
        type: string
      last_reviewed:
        type: string

  company:
    folder: Entities/Companies
    statuses: [target, applied, interviewing, offered, rejected, hired, archived, superseded]
    fields:
      country:
        type: string
      size:
        type: enum
        values: [startup, small, medium, large, mega]
      website:
        type: string
      resume_language:
        type: enum
        values: [ko, en, ja, zh, 한국어, English]
      positions:
        type: list
        items:
          type: object
          fields:
            title:
              type: string
              required: true
            seniority:
              type: string
            keywords:
              type: list
              items: string
            jd_url:
              type: string
      notes:
        type: string
      confidence:
        type: number
      created:
        type: string
      t_invalid:
        type: string
      last_reviewed:
        type: string

  concept:
    folder: Concepts
    statuses: [active, draft, archived, superseded]
    fields:
      aliases:
        type: list
        items: string
      keywords:
        type: list
        items: string
      kind:
        type: enum
        values: [technology, tool, algorithm, methodology]
      created:
        type: string
      t_invalid:
        type: string

  insight:
    folder: Insights
    year_month: true
    statuses: [draft, active, archived, superseded]
    fields:
      question:
        type: string
      command:
        type: string
      created:
        type: string
      observed_at:
        type: string
      t_invalid:
        type: string
      related:
        type: list
        items: string
      keywords:
        type: list
        items: string
      confidence:
        type: number

  log:
    folder: Logs
    year_month: true
    statuses: [active, archived, superseded]
    fields:
      command:
        type: string
      summary:
        type: string
      created:
        type: string
      observed_at:
        type: string
      t_invalid:
        type: string
      related:
        type: list
        items: string
      keywords:
        type: list
        items: string

  profile:
    folder: Profile
    statuses: [active, draft, archived, superseded]
    fields:
      scope:
        type: string
      confidence:
        type: number
      created:
        type: string
      t_invalid:
        type: string

relations:
  uses:
    domain: [project, company, concept, insight, log, profile]
    range: [concept]
    cardinality: many
  part_of:
    domain: [project, company, concept, insight, log, profile]
    range: [project, company, concept, insight, log, profile]
    cardinality: many
    axioms:
      transitive: true
      inverse: has_part
  broader:
    domain: [concept]
    range: [concept]
    cardinality: many
    axioms:
      transitive: true
      inverse: narrower
  decided_in:
    domain: [project, company, concept, insight, log, profile]
    range: [insight, log]
    cardinality: many
  supersedes:
    # 보류: Step 5(supersedes) 메커니즘 배선 전까지 emit 유도 안 함.
    domain: [project, company, concept, insight, log, profile]
    range: [project, company, concept, insight, log, profile]
    cardinality: many
  same_as:
    # 보류: Step 7(same_as) 메커니즘 배선 전까지 emit 유도 안 함.
    domain: [project, company, concept, insight, log, profile]
    range: [project, company, concept, insight, log, profile]
    cardinality: many

legacy_mappings:
  domain:
    maps_to: concept
    reason: v1 domain은 기술/주제 분류였고 v2 concept가 같은 지식 노드 역할을 한다.
  life:
    maps_to: skip
    reason: v1 life는 개인 생활 폴더 분류였고 typed entity로 소비된 인스턴스가 없어 Step 6a에서는 엔티티로 승격하지 않는다.
